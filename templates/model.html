{% extends "base.html" %}
{% block content %}

<div class="glass-card">
    <h2>Train Machine Learning Model</h2>

    <p class="subtitle">
        “Without data, you're just another person with an opinion.”
    </p>

    <form method="POST">
        <button class="btn-secondary">Train & Select Best Model</button>
    </form>

    {% if score %}
    <hr>
    <p><b>Best Model:</b> {{ best_model }}</p>
    <p><b>Accuracy:</b> {{ score }}</p>
    {% endif %}
</div>

{% endblock %}
