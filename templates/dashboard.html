{% extends "base.html" %}
{% block content %}

<div class="premium-container">

    <h1 class="page-title">📊 Advanced Analytics Dashboard</h1>

    <!-- STAT CARDS -->
    <div class="dashboard-grid">

        <div class="stat-card total">
            <h3>Total Predictions</h3>
            <h2>{{ total }}</h2>
        </div>

        <div class="stat-card danger">
            <h3>Churn Customers</h3>
            <h2>{{ churn }}</h2>
        </div>

        <div class="stat-card success">
            <h3>No Churn Customers</h3>
            <h2>{{ nochurn }}</h2>
        </div>

    </div>

    <!-- CHART ROW 1 -->
    <div class="chart-row">

        <div class="glass-card">
            <h3>Churn vs No Churn</h3>
            <canvas id="pieChart"></canvas>
        </div>

        <div class="glass-card">
            <h3>Risk Level Distribution</h3>
            <canvas id="riskChart"></canvas>
        </div>

    </div>

    <!-- CHART ROW 2 -->
    <div class="chart-row">

        <div class="glass-card">
            <h3>Predictions Over Time</h3>
            <canvas id="trendChart"></canvas>
        </div>

        <div class="glass-card">
            <h3>Probability Spread</h3>
            <canvas id="probChart"></canvas>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// -------- PIE CHART --------
var ctx = document.getElementById('pieChart').getContext('2d');

new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Churn', 'No Churn'],
        datasets: [{
            data: [{{ churn }}, {{ nochurn }}],
            backgroundColor: ['#ff4b5c', '#4caf50'],
            borderWidth: 2,
            borderColor: '#ffffff'
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                labels: { color: 'white' }
            }
        }
    }
});


// -------- RISK DISTRIBUTION --------
var riskCtx = document.getElementById('riskChart').getContext('2d');

new Chart(riskCtx, {
    type: 'bar',
    data: {
        labels: [
            {% for r in risk_data %}
                "{{ r[0] }}",
            {% endfor %}
        ],
        datasets: [{
            label: "Customers",
            data: [
                {% for r in risk_data %}
                    {{ r[1] }},
                {% endfor %}
            ],
            backgroundColor: ['#ff4b5c', '#ffa500', '#4caf50']
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                labels: { color: 'white' }
            }
        }
    }
});


// -------- TREND CHART --------
var trendCtx = document.getElementById('trendChart').getContext('2d');

new Chart(trendCtx, {
    type: 'line',
    data: {
        labels: [
            {% for t in trend %}
                "{{ t[0] }}",
            {% endfor %}
        ],
        datasets: [{
            label: "Predictions",
            data: [
                {% for t in trend %}
                    {{ t[1] }},
                {% endfor %}
            ],
            borderColor: '#00bcd4',
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                labels: { color: 'white' }
            }
        }
    }
});


// -------- PROBABILITY HISTOGRAM --------
var probCtx = document.getElementById('probChart').getContext('2d');

new Chart(probCtx, {
    type: 'bar',
    data: {
        labels: [
            {% for p in probabilities %}
                "{{ loop.index }}",
            {% endfor %}
        ],
        datasets: [{
            label: "Churn Probability %",
            data: [
                {% for p in probabilities %}
                    {{ p[0] }},
                {% endfor %}
            ],
            backgroundColor: '#6a11cb'
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                labels: { color: 'white' }
            }
        }
    }
});

</script>

<style>

.premium-container {
    width: 95%;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.page-title {
    margin-bottom: 20px;
    color: white;
}

.dashboard-grid {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    justify-content: center;
}

.stat-card {
    flex: 1;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
}

.stat-card:hover {
    transform: scale(1.05);
}

.stat-card h3 {
    margin-bottom: 10px;
}

.stat-card h2 {
    font-size: 32px;
}

.total {
    background: linear-gradient(to right, #6a11cb, #2575fc);
}

.danger {
    background: linear-gradient(to right, #ff416c, #ff4b2b);
}

.success {
    background: linear-gradient(to right, #00b09b, #96c93d);
}

.chart-row {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.glass-card {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

canvas {
    margin-top: 15px;
}

</style>

{% endblock %}
